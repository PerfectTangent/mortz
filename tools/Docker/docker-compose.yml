# docker compose up -d
# Game args go under command:, they get appended to the entrypoint.
services:
  mortz-server:
    # For standalone, use :standalone and remove --steam-public.
    image: ghcr.io/corp-0/mortz-server:steam
    container_name: mortz-server
    restart: unless-stopped
    ports:
      # game port
      - "7777:7777/udp"
      # server browser information port. Only non-steam servers need it.
      - "7778:7778/udp"
    volumes:
      # Keeps the server ID across image updates, so players' Steam favorites still find it.
      - mortz-data:/home/mortz/data
      #- ./server.toml:/home/mortz/server.toml:ro
      #- ./ruleset.toml:/home/mortz/ruleset.toml:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
volumes:
  mortz-data:
