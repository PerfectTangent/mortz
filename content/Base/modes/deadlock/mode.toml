format_version = 1
name = "Deadlock"
description = "Hold the control zones to capture the shared bar. Full capture wins."
identity = ["rules.teams", "rules.score", "rules.winner", "rules.evaluation", "rules.replay", "rules.end_condition.type", "rules.objective.type", "rules.respawn.type"]

[rules]
teams = true
score = "kills"
winner = "qualifying"
evaluation = "tick"
replay = "none"

[rules.end_condition]
type = "objective_completion"

[rules.objective]
type = "deadlock"
capture_speed = 5
decay_speed = 5
absence_delay = 2.0

[rules.respawn]
type = "escalating"
base_delay = 2.0
increase = 1.0
maximum_delay = 10.0
